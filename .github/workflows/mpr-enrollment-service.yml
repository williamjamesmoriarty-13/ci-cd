name: MPR — enrollment-service

on:
  push:
    branches: [main]
    paths:
      - 'enrollment-service/**'
      - '.github/workflows/mpr-enrollment-service.yml'

concurrency:
  group: mpr-enrollment-service-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Tests end-to-end (stack complète)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build + up docker-compose + tests e2e
        run: ./scripts/e2e-test.sh

  build-scan-push:
    name: Build, scan Trivy, push Docker Hub
    needs: e2e
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Déterminer le tag d'image
        id: vars
        run: echo "image_tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build de l'image
        run: |
          docker build -f enrollment-service/Dockerfile \
            -t docker.io/darbi/university-enrollment-service:${{ steps.vars.outputs.image_tag }} \
            enrollment-service/

      - name: Scan de vulnérabilités — Trivy (avant push)
        uses: aquasecurity/trivy-action@v0.36.0  
        with:
          image-ref: docker.io/darbi/university-enrollment-service:${{ steps.vars.outputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push vers Docker Hub
        run: docker push docker.io/darbi/university-enrollment-service:${{ steps.vars.outputs.image_tag }}

  update-helm-repo:
    name: Bump du tag dans university-helm (branche CI_Confirmed)
    needs: build-scan-push
    runs-on: ubuntu-latest
    steps:
      - name: Clone du repo Helm
        run: git clone https://github.com/RehozoedArbi/university-helm.git

      - name: Connexion à GitHub (authentification pour le push)
        working-directory: university-helm
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.HELM_REPO_TOKEN }}@github.com/RehozoedArbi/university-helm.git"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # HELM_REPO_TOKEN : PAT (fine-grained, écriture limitée à CE
          # repo) ou token d'une GitHub App dédiée. Jamais le GITHUB_TOKEN
          # par défaut, qui n'a pas accès à university-helm.

      - name: Installer yq
        run: |
          sudo curl -sSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Modifier le tag enrollmentService dans values.yaml
        working-directory: university-helm/university-app
        run: |
          yq -i '.enrollmentService.tag = "${{ needs.build-scan-push.outputs.image_tag }}"' values.yaml

      - name: Push vers la branche CI_Confirmed
        working-directory: university-helm
        run: |
          git checkout -B CI_Confirmed
          git add university-app/values.yaml
          git commit -m "chore(enrollment-service): bump image to ${{ needs.build-scan-push.outputs.image_tag }}"
          git push origin CI_Confirmed --force-with-lease

