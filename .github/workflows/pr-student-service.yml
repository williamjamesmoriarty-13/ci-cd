name: PR — student-service

on:
  push:
    branches: [main]
    paths:
      - 'student-service/**'
      - 'lint/**'                                  # config + script de lint partagés
      - '.github/workflows/pr-student-service.yml'

concurrency:
  group: pr-student-service-${{ github.head_ref }}
  cancel-in-progress: true

permissions:
  contents: read                                    # least-privilege : lecture seule, rien à écrire ici

jobs:
  lint:
    name: Lint, SAST, audit dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'                    # garde aligné avec python:3.12-slim de ton Dockerfile
          cache: 'pip'
          cache-dependency-path: student-service/requirements.txt

      - name: Installer les outils d'analyse (flake8, bandit, pip-audit)
        run: pip install flake8 bandit pip-audit

      - name: Lint & SAST & audit — student-service uniquement
        run: ./lint/scripts/lint.sh --service student --no-gitleaks
        # gitleaks tourne dans un workflow séparé repo-wide (pr-secrets-scan.yml)
        # pour éviter 3 scans identiques du repo entier à chaque PR

  unit-tests:
    name: Tests unitaires (sans DB)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: student-service/requirements.txt

      - name: Installer les dépendances
        working-directory: student-service
        run: |
          pip install -r requirements-test.txt

      - name: Tests unitaires
        working-directory: student-service
        run: pytest tests/unit/student-service-test.py -v --cov=app
        # Aucun service Postgres ici volontairement : si un de ces tests
        # tente une vraie connexion DB, il échouera — ce qui est le signal
        # qu'il n'est pas vraiment "unitaire" et doit être déplacé/mocké.

  migration-check:
    name: Vérification des migrations Alembic
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16                          # <-- aligne cette version sur celle de ton docker-compose.yml
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: student_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/student_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: student-service/requirements.txt

      - name: Installer les dépendances (juste ce qu'il faut pour migrer)
        working-directory: student-service
        run: pip install -r requirements.txt

      - name: Appliquer les migrations
        working-directory: student-service
        run: alembic upgrade head

      - name: Vérifier la réversibilité (downgrade puis re-upgrade)
        working-directory: student-service
        run: |
          alembic downgrade -1
          alembic upgrade head
        # Attrape les migrations qui montent mais ne redescendent pas proprement —
        # utile avant un vrai rollback en prod.

  docker-build:
    name: Build image + scan Trivy
    needs: [unit-tests, migration-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build de l'image (validation uniquement — pas de push en PR)
        run: docker build -f student-service/Dockerfile -t student-service:pr-${{ github.event.pull_request.number }} student-service/

      - name: Scan de vulnérabilités — Trivy
        uses: aquasecurity/trivy-action@v0.36.0   # vérifie toi-même la dernière release avant de committer
        with:
          image-ref: student-service:pr-${{ github.event.pull_request.number }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true