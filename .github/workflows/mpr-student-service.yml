name: MPR — student-service

# Déclenché sur merge vers main. e2e → build → scan → push Docker Hub →
# bump du tag dans university-helm (branche CI_Confirmed).
# AUCUN déploiement ici : ArgoCD surveille le repo Helm et synchronise
# lui-même. Les migrations DB ne sont pas ici non plus — hook Helm
# pre-upgrade côté chart, exécuté par le cluster au moment du déploiement.

on:
  push:
    branches: [main]
    paths:
      - 'student-service/**'
      - '.github/workflows/mpr-student-service.yml'
concurrency:
  group: mpr-student-service-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: Tests end-to-end (stack complète)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lancer les services avec Docker Compose
        # continue-on-error force le pipeline à continuer même si le healthcheck échoue au `docker compose up`
        continue-on-error: true
        run: |
          docker compose up --build -d

      - name: Attendre le démarrage des services
        run: |
          echo "Attente de 30 secondes pour laisser le temps aux services de s'initialiser..."
          sleep 30

      - name: Vérifier l'état des conteneurs
        run: |
          docker compose ps -a

      - name: Afficher les logs du service teacher-admin-service
        # S'exécute TOUJOURS, peu importe si les étapes précédentes ont échoué ou réussi
        if: always()
        run: |
          echo "=================================================="
          echo "    LOGS DU SERVICE TEACHER-ADMIN-SERVICE        "
          echo "=================================================="
          docker compose logs teacher-admin-service
      - name: Build + up docker-compose + tests e2e
        run: ./scripts/e2e-test.sh

